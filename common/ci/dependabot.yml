# actions 를 major 태그로 쓰되 Dependabot 이 갱신을 열게 한다.
# SHA 핀이 더 엄격하지만 사람이 손으로 갱신하면 결국 낡는다 — 자동 PR 이 실질적이다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
