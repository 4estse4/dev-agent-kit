# ai-kit 게이트 워크플로.
# 게이트 명령을 여기 복붙하지 않는다 — 레포에 vendor 된 .ai-kit/gate/gate.sh 를
# 부른다. 로컬 훅·CI 가 문자 그대로 같은 스크립트를 돌아야 드리프트가 없다.
name: gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      node: ${{ steps.d.outputs.node }}
      jvm: ${{ steps.d.outputs.jvm }}
      py: ${{ steps.d.outputs.py }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        # 여기서 감지하지 못한 언어는 gate 잡의 모든 단계가 건너뛰어지고
        # 잡이 초록으로 끝난다 — 아무것도 검사하지 않은 채로. 어댑터를 추가하면
        # 반드시 여기도 같이 추가해야 한다.
        run: |
          find . -name go.mod -not -path '*/node_modules/*' -maxdepth 3 | grep -q . \
            && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          find . -name package.json -not -path '*/node_modules/*' -maxdepth 3 | grep -q . \
            && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          find . \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \
                    -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'pom.xml' \) \
               -not -path '*/build/*' -maxdepth 3 | grep -q . \
            && echo "jvm=true" >> "$GITHUB_OUTPUT" || echo "jvm=false" >> "$GITHUB_OUTPUT"
          find . -name pyproject.toml -not -path '*/.venv/*' -maxdepth 3 | grep -q . \
            && echo "py=true" >> "$GITHUB_OUTPUT" || echo "py=false" >> "$GITHUB_OUTPUT"

  vendored:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      # 로컬 훅은 clone 마다 활성화가 필요해 신뢰할 수 없다. 최소한 게이트가
      # 레포에 vendor 돼 있는지는 CI 가 확인한다 — 없으면 CI 도 못 돈다.
      - name: .ai-kit 게이트가 커밋돼 있는지
        run: |
          for f in .ai-kit/gate/gate.sh .ai-kit/gate/secrets.sh .ai-kit/gate/trace.sh \
                   .ai-kit/git-hooks/pre-commit .ai-kit/git-hooks/pre-push; do
            [ -f "$f" ] || { echo "::error::$f 가 없습니다 — 킷의 install.sh 를 실행하고 .ai-kit 를 커밋하세요 (.ai-kit/README.md 참조)"; exit 1; }
          done
          # 존재만으로는 부족하다. 실행권한 없는 훅을 git 은 hint 한 줄만 남기고
          # 건너뛴다 — 커밋은 성공하고 강제는 꺼진다. 모드는 커밋되므로 clone 하는
          # 모든 사람에게 꺼진 채로 퍼지고, 로컬에서는 아무도 눈치채지 못한다.
          # 우회 불가능한 층은 CI 뿐이므로 모드 확인도 여기서 한다.
          # (게이트 스크립트는 훅이 `bash <경로>` 로 부르므로 권한이 필요 없다.)
          for f in .ai-kit/git-hooks/pre-commit .ai-kit/git-hooks/pre-push; do
            [ -x "$f" ] || { echo "::error::$f 에 실행권한이 없습니다 — 훅이 조용히 건너뛰어집니다. git update-index --chmod=+x $f 로 고치고 커밋하세요"; exit 1; }
          done
          cat .ai-kit/VERSION 2>/dev/null || echo "VERSION 없음"
          # 체크섬 재계산 — vendor 파일을 손으로 고치면 여기서 드러난다.
          # 버전 표시가 실제 내용과 어긋나면 디버깅이 헛다리를 짚는다.
          recorded=$(grep -oE 'checksum=[0-9a-f]+' .ai-kit/VERSION 2>/dev/null | cut -d= -f2)
          # 체크섬 정의는 vendor 된 lib.sh 한 곳에만 있다 — 여기서 복붙하면 드리프트한다.
          . .ai-kit/gate/lib.sh
          actual=$(gate_checksum .ai-kit)
          if [ -n "$recorded" ] && [ "$recorded" != "$actual" ]; then
            echo "::error::.ai-kit 내용이 기록된 체크섬과 다릅니다 (기록 $recorded, 실제 $actual)."
            echo "손으로 고쳤다면 킷에 반영하고 install.sh 를 다시 실행하세요."
            exit 1
          fi

  gate:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # 도구 버전은 .ai-kit/gate/tool-versions 가 단일 출처다. 여기 숫자를 박으면
      # 로컬과 CI 가 반드시 갈라진다 — 실제로 그래서 로컬만 낡은 린터를 쓰고 있었다.
      - id: tv
        name: read pinned tool versions
        run: |
          f=.ai-kit/gate/tool-versions
          [ -f "$f" ] || { echo "::error::$f 가 없습니다 — 킷을 갱신하세요"; exit 1; }
          while IFS='=' read -r k v; do
            case "$k" in ''|\#*) continue ;; esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < "$f"

      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - if: needs.detect.outputs.go == 'true'
        run: |
          # 버전을 핀한다. @latest 는 코드 변경 없이 포맷 규칙이 바뀌어
          # cold cache 에서 게이트가 빨개지는 재현성 구멍이다.
          go install golang.org/x/tools/cmd/goimports@${{ steps.tv.outputs.goimports }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # golangci-lint-action 은 스스로 lint 를 실행한다 — 게이트 단일 정의와
      # 충돌하므로 쓰지 않는다. 바이너리만 버전 핀해 설치하고 실행은 gate.sh 가 한다.
      # curl | sh 대신 go install 을 쓴다(공급망 표면을 모듈 프록시로 한정).
      - if: needs.detect.outputs.go == 'true'
        name: install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.tv.outputs.golangci_lint }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # JVM: 빌드는 래퍼가 맡으므로 JDK 만 있으면 된다. 버전은 프로젝트가 정한다.
      #
      # 이 액션 이름은 setup-java 지만 **Java 언어 지원이 아니라 JDK(자바 가상 머신)
      # 설치기**다. Kotlin 이 JVM 위에서 도는 언어라 컴파일에 JDK 가 필요하다.
      # 킷은 Java 소스를 검사하지 않는다 — ktlint 는 .kt 만 보고, Java 포매터·린터는
      # 두지 않았다(common/gate/adapters/jvm.sh 의 설명 참조). 여기 있는 것은 런타임뿐이다.
      - if: needs.detect.outputs.jvm == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.AI_KIT_JAVA_VERSION || '21' }}
          cache: gradle
      - if: needs.detect.outputs.jvm == 'true'
        name: install ktlint
        # 린트는 빌드 도구를 거치지 않고 직접 돈다 — golangci-lint 와 같은 모양이다.
        # 버전을 핀한다. @latest 는 코드 변경 없이 규칙이 바뀌어 게이트가 빨개진다.
        run: |
          curl -fsSL -o /tmp/ktlint \
            https://github.com/pinterest/ktlint/releases/download/${{ steps.tv.outputs.ktlint }}/ktlint
          chmod +x /tmp/ktlint && sudo mv /tmp/ktlint /usr/local/bin/ktlint
          ktlint --version

      # Python: 도구는 프로젝트 환경의 것을 쓰는 것이 원칙이지만, ruff 는
      # 프로젝트 의존성과 무관한 독립 바이너리라 버전을 핀해 설치한다.
      # mypy·pytest 는 프로젝트가 자기 의존성으로 설치해야 한다(아래 주석 참조).
      - if: needs.detect.outputs.py == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - if: needs.detect.outputs.py == 'true'
        name: install ruff
        run: pipx install ruff==${{ steps.tv.outputs.ruff }} && ruff --version
      # 프로젝트가 mypy·pytest 를 쓰면 여기에 자기 의존성 설치 단계를 추가한다.
      # 킷은 그것이 uv 인지 pip 인지 poetry 인지 알 수 없다 — 워크플로는 프로젝트 소유다.
      #   - if: needs.detect.outputs.py == 'true'
      #     run: uv sync --group dev   (또는 pip install -e '.[dev]')

      - if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: npm }
        continue-on-error: true
      - if: needs.detect.outputs.node == 'true'
        run: |
          for d in $(dirname $(find . -name package.json -not -path '*/node_modules/*' -maxdepth 3)); do
            (cd "$d" && npm ci --no-audit --no-fund)
          done

      # 게이트 본체 — 로컬 pre-push 와 같은 스크립트.
      - run: bash .ai-kit/gate/gate.sh --all

  coverage:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠️ 프로젝트에 env 게이트된 통합 테스트(DB 등)가 있다면 gate 잡과 같은
    #    services 를 여기에도 붙여야 한다. 없으면 그 테스트가 skip 되어
    #    커버리지가 과소 보고된다 — 틀린 숫자는 없느니만 못하다.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      # 먼저 측정하고 보이게 한다. 임계값은 COVER_MIN 을 설정할 때만 강제한다 —
      # 첫날부터 실패하는 임계값은 결국 꺼진다.
      - name: 패키지별 커버리지
        env:
          COVER_MIN: ${{ vars.COVER_MIN }}
        run: |
          go test -cover ./... 2>&1 | tee /tmp/cov.txt
          {
            echo "### 커버리지"
            echo '```'
            grep -E 'coverage:' /tmp/cov.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$COVER_MIN" ] && { echo "COVER_MIN 미설정 — 보고만 합니다."; exit 0; }
          low=$(grep -oE 'coverage: [0-9.]+' /tmp/cov.txt | awk -v m="$COVER_MIN" '{if ($2+0 < m) print}')
          [ -n "$low" ] && { echo "::error::COVER_MIN=$COVER_MIN 미만 패키지가 있습니다"; echo "$low"; exit 1; }
          exit 0

  security:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # 이 잡은 별도 체크아웃이라 gate 잡의 출력을 못 쓴다 — 같은 파일을 다시 읽는다.
      # 숫자를 여기 박으면 그 순간부터 단일 출처가 아니게 된다.
      - id: tv
        name: read pinned tool versions
        run: |
          f=.ai-kit/gate/tool-versions
          [ -f "$f" ] || { echo "::error::$f 가 없습니다 — 킷을 갱신하세요"; exit 1; }
          while IFS='=' read -r k v; do
            case "$k" in ''|\#*) continue ;; esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < "$f"

      - name: 시크릿 스캔 (PR 범위)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [ -n "$base" ] && [ -n "$head" ]; then
            bash .ai-kit/gate/secrets.sh --range "${base}..${head}"
          else
            bash .ai-kit/gate/secrets.sh --range "HEAD~1..HEAD"
          fi

      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - if: needs.detect.outputs.go == 'true'
        name: govulncheck
        # go.mod 가 루트에 없을 수 있다(모노레포). 모듈마다 실행한다.
        run: |
          # govulncheck 도 핀한다 — 취약점 DB 는 항상 최신을 받지만
          # 도구 동작 자체가 조용히 바뀌는 것은 막는다.
          go install golang.org/x/vuln/cmd/govulncheck@${{ steps.tv.outputs.govulncheck }}
          export PATH="$(go env GOPATH)/bin:$PATH"
          fail=0
          while IFS= read -r mod; do
            d=$(dirname "$mod")
            echo "── govulncheck $d ──"
            ( cd "$d" && govulncheck ./... ) || fail=1
          done < <(find . -name go.mod -not -path '*/node_modules/*' -maxdepth 3)
          exit $fail

      - if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }
        continue-on-error: true
      - if: needs.detect.outputs.node == 'true'
        name: npm audit (high+)
        run: |
          for d in $(dirname $(find . -name package-lock.json -not -path '*/node_modules/*' -maxdepth 3)); do
            (cd "$d" && npm audit --audit-level=high)
          done

  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # SPEC 요구가 추적표에서 조용히 사라지는 것을 막는다.
      - run: bash .ai-kit/gate/trace.sh
