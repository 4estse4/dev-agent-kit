# ai-kit 게이트 워크플로.
# 게이트 명령을 여기 복붙하지 않는다 — 레포에 vendor 된 .ai-kit/gate/gate.sh 를
# 부른다. 로컬 훅·CI 가 문자 그대로 같은 스크립트를 실행해야 드리프트가 없다.
name: gates

on:
  pull_request:
  push:
    branches: [main, master]

# 워크플로 레벨 기본값. ${{ env.X }} 는 여기 선언된 것만 읽는다 —
# env 블록 없이 `${{ env.X || '기본' }}` 을 쓰면 **항상 기본값**이 되고,
# "오버라이드 가능" 은 거짓말이 된다. 프로젝트는 이 값을 고쳐서 바꾼다.
env:
  AI_KIT_JAVA_VERSION: "21"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      gomod: ${{ steps.d.outputs.gomod }}
      node: ${{ steps.d.outputs.node }}
      jvm: ${{ steps.d.outputs.jvm }}
      py: ${{ steps.d.outputs.py }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        # 여기서 감지하지 못한 언어는 도구와 의존성을 설치하는 스텝이 건너뛰어진다.
        # gate 잡의 마지막 스텝(gate.sh --all)은 그래도 그 모듈을 찾는다. 러너에 도구가
        # 없으면 빨갛게 끝나지만, 러너 이미지에 이미 있는 도구로 실행되면 버전을 핀하지 않은
        # 채 초록으로 끝난다. security 잡의 언어별 취약점 검사는 어느 쪽이든 조용히
        # 건너뛰어진다. 어댑터를 추가하면 반드시 여기도 같이 추가해야 한다.
        #
        # 마커를 찾는 기준은 게이트(gate.sh)와 같다. 깊이를 제한하지 않고, 건너뛸 디렉터리는
        # lib.sh 의 gate_prune_expr 하나를 쓴다. 한때 여기만 maxdepth 3 이라 네 단계 아래의
        # 모듈을 게이트는 보고 이 감지는 못 봤다. 아래 스텝들의 find 도 같은 기준이다.
        # 대부분 -print -quit 로 첫 하나에서 멈춘다.
        run: |
          . .ai-kit/gate/lib.sh
          find . \( $(gate_prune_expr) \) -prune -o -name go.mod -print > "$RUNNER_TEMP/go.mods"; \
            gomod=$(gate_go_highest < "$RUNNER_TEMP/go.mods"); \
            [ -n "$gomod" ] && echo "gomod=${gomod#./}" >> "$GITHUB_OUTPUT" && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          find . \( $(gate_prune_expr) \) -prune -o -name package.json -print -quit | grep -q . \
            && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          find . \( $(gate_prune_expr) \) -prune -o \
                 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \
                    -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
                 -print -quit | grep -q . \
            && echo "jvm=true" >> "$GITHUB_OUTPUT" || echo "jvm=false" >> "$GITHUB_OUTPUT"
          find . \( $(gate_prune_expr) \) -prune -o -name pyproject.toml -print -quit | grep -q . \
            && echo "py=true" >> "$GITHUB_OUTPUT" || echo "py=false" >> "$GITHUB_OUTPUT"

  vendored:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      # 로컬 훅은 clone 마다 활성화가 필요해 신뢰할 수 없다. 최소한 게이트가
      # 레포에 vendor 돼 있는지는 CI 가 확인한다 — 없으면 CI 도 실행할 수 없다.
      - name: .ai-kit 게이트가 커밋돼 있는지
        run: |
          for f in .ai-kit/gate/gate.sh .ai-kit/gate/secrets.sh .ai-kit/gate/trace.sh \
                   .ai-kit/git-hooks/pre-commit .ai-kit/git-hooks/pre-push; do
            [ -f "$f" ] || { echo "::error::$f 가 없습니다 — 킷의 install.sh 를 실행하고 .ai-kit 를 커밋하세요 (.ai-kit/README.md 참조)"; exit 1; }
          done
          # 존재만으로는 부족하다. 실행권한 없는 훅을 git 은 hint 한 줄만 남기고
          # 건너뛴다 — 커밋은 성공하고 강제는 꺼진다. 모드는 커밋되므로 clone 하는
          # 모든 사람에게 꺼진 채로 퍼지고, 로컬에서는 아무도 눈치채지 못한다.
          # 우회할 수 없는 것은 CI 뿐이므로 모드 확인도 여기서 한다.
          # (게이트 스크립트는 훅이 `bash <경로>` 로 부르므로 권한이 필요 없다.)
          for f in .ai-kit/git-hooks/pre-commit .ai-kit/git-hooks/pre-push; do
            [ -x "$f" ] || { echo "::error::$f 에 실행권한이 없습니다 — 훅이 조용히 건너뛰어집니다. git update-index --chmod=+x $f 로 고치고 커밋하세요"; exit 1; }
          done
          # 어느 킷에서 왔는지만 출력한다. **내용이 킷과 같은지는 검사하지 않는다** —
          # 이 레포에서 게이트를 고치는 것이 정상 작업이기 때문이다(.ai-kit/README.md).
          # 무엇이 달라졌는지 보려면 킷에서 install.sh <경로> --dry-run 을 실행한다.
          cat .ai-kit/install-manifest 2>/dev/null || echo "install-manifest 없음"

  gate:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # 도구 버전은 .ai-kit/gate/tool-versions 가 단일 출처다. 여기 숫자를 적어 두면
      # 로컬과 CI 의 버전이 반드시 달라진다 — 실제로 그래서 로컬만 낡은 린터를 쓰고 있었다.
      - id: tv
        name: read pinned tool versions
        run: |
          f=.ai-kit/gate/tool-versions
          [ -f "$f" ] || { echo "::error::$f 가 없습니다 — 킷을 갱신하세요"; exit 1; }
          while IFS='=' read -r k v; do
            case "$k" in ''|\#*) continue ;; esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < "$f"

      # 킷이 지원하는 Go 는 tool-versions 의 go_min 이상이다. setup-go 가 설치하는 Go 가 그보다 낮으면
      # 아래 설치 스텝이 「requires go >= …」로 실패하거나(실제로 확인함), 설치는 되어도 golangci-lint 의
      # gofumpt 와 gofmt 가 서로 다른 모양을 요구해 게이트를 통과하지 못하는 코드가 생긴다(tool-versions 의
      # go_min 주석). 그 전에 어느 go.mod 가 몇인지 말하며 멈춘다. setup-go 를 쓰는 잡마다 그 앞에서
      # 부른다(lib.sh 의 gate_go_min_check).
      - if: needs.detect.outputs.go == 'true'
        name: require the kit's minimum Go
        run: |
          . .ai-kit/gate/lib.sh
          gate_go_min_check
      # detect 의 gomod 는 설치할 Go(toolchain 줄이 있으면 그 버전, 없으면 go 줄)가 가장 높은 go.mod 다.
      # 세 잡의 setup-go 가 그것으로 Go 를 설치한다.
      # go.mod 는 레포 루트에 없을 수 있고(backend/go.mod 같은 배치) 여럿일 수 있다. 한때
      # 루트의 go.mod 를 가리켜 그런 레포에서 세 잡이 모두 실패했다(실제로 확인함). setup-go 는
      # GOTOOLCHAIN=local 이라 더 높은 go 를 받아 오지 않으므로 가장 높은 것을 설치한다.
      # 캐시 키는 레포 전체의 go.mod 와 go.sum 으로 만든다. `cache-dependency-path` 가 없으면 setup-go 는
      # 레포 루트의 go.mod 하나만 찾고, 없으면 경고만 출력하고 캐시를 복원도 저장도 하지 않는다(실제로 확인함,
      # 이슈 #96). go.sum 은 의존성이 없는 모듈에는 없으므로 go.mod 도 같이 적는다 — Go 잡은 go.mod 가
      # 있을 때만 실행되므로 맞는 파일이 늘 있다. coverage · security 잡도 같다.
      # 키는 설치한 Go 버전과 cache-dependency-path 에 맞은 파일의 해시로 만든다(setup-go v7 의
      # src/cache-restore.ts). 세 잡이 같은 Go 와 같은 패턴을 적으므로 키가 같고, 먼저 끝난 잡의 모듈 캐시와
      # 빌드 캐시가 저장되며 나머지 잡은 저장하지 못한다. 잡마다 다른 파일을 적으면 키가 달라지지만, 그래도
      # go install 이 만든 도구는 캐시되지 않는다(아래). 도구는 아래에서 따로 캐시한다.
      - if: needs.detect.outputs.go == 'true'
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: '${{ needs.detect.outputs.gomod }}'
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      # go install 이 만든 도구는 setup-go 의 캐시에 남지 않는다. setup-go 는 GOMODCACHE 와 GOCACHE 만 캐시하고
      # (src/package-managers.ts), 그 캐시도 위처럼 먼저 끝난 잡의 것이다. 그래서 실행마다 도구를 다시 빌드했다
      # (이슈 #115). 도구만 담는 디렉터리를 잡마다 다른 키로 캐시하고, 복원이 안 됐을 때만 설치한다.
      # 키에는 Go 버전과 핀을 넣는다. golangci-lint 는 자기를 빌드한 Go 보다 높은 go.mod 를 검사하지 못하고,
      # 핀이 바뀌면 다시 빌드해야 한다. restore-keys 를 두지 않는 것도 같은 이유다.
      # 저장은 설치 바로 뒤에 한다. actions/cache 와 setup-go 의 저장은 post 단계이고 `post-if: success()` 라서,
      # 게이트가 실패한 실행에서는 저장하지 않는다.
      # 도구는 cgo 없이(CGO_ENABLED=0) 빌드한다. 키에 러너 이미지가 없으므로 ubuntu-latest 가 다른 이미지로
      # 옮겨 가는 기간에는 다른 이미지에서 빌드한 도구를 복원한다. cgo 를 켜면(러너의 기본값이다) 도구가 그
      # 이미지의 glibc 에 동적으로 링크될 수 있다. ubuntu24 러너에서 golangci-lint 와 govulncheck 가 그랬다(실제로
      # 확인함). golangci-lint 의 배포판도 CGO_ENABLED=0 으로 빌드한다(그 레포의 .goreleaser.yml).
      - if: needs.detect.outputs.go == 'true'
        id: gotools
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ai-kit/go-tools
          key: ai-kit-go-tools-gate-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-goimports-${{ steps.tv.outputs.goimports }}-golangci-lint-${{ steps.tv.outputs.golangci_lint }}
      - if: needs.detect.outputs.go == 'true' && steps.gotools.outputs.cache-hit != 'true'
        run: |
          # 버전을 핀한다. @latest 는 코드 변경 없이 포맷 규칙이 바뀌어
          # cold cache 에서 게이트가 빨개지는 재현성 구멍이다.
          CGO_ENABLED=0 GOBIN="$HOME/.cache/ai-kit/go-tools" go install golang.org/x/tools/cmd/goimports@${{ steps.tv.outputs.goimports }}
      # golangci-lint-action 은 스스로 lint 를 실행한다 — 게이트 단일 정의와
      # 충돌하므로 쓰지 않는다. 바이너리만 버전 핀해 설치하고 실행은 gate.sh 가 한다.
      # curl | sh 대신 go install 을 쓴다(공급망 표면을 모듈 프록시로 한정).
      - if: needs.detect.outputs.go == 'true' && steps.gotools.outputs.cache-hit != 'true'
        name: install golangci-lint
        run: |
          CGO_ENABLED=0 GOBIN="$HOME/.cache/ai-kit/go-tools" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.tv.outputs.golangci_lint }}
      - if: needs.detect.outputs.go == 'true' && steps.gotools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ai-kit/go-tools
          key: ${{ steps.gotools.outputs.cache-primary-key }}
      # 복원했든 설치했든 도구는 이 디렉터리에 있다.
      - if: needs.detect.outputs.go == 'true'
        run: echo "$HOME/.cache/ai-kit/go-tools" >> "$GITHUB_PATH"

      # JVM: 빌드는 래퍼가 맡으므로 JDK 만 있으면 된다.
      #
      # 래퍼가 없으면 **여기서 실패시킨다.** ubuntu 러너 이미지에는 gradle 이 들어
      # 있어서 래퍼 없이도 CI 는 통과하는데, 그러면 (a) gradle 버전이 러너 이미지에
      # 묶여 고정되지 않고 — 린터 버전을 핀한 이유와 정면으로
      # 어긋난다 — (b) gradle 이 없는 개발자 머신에서는 로컬이 빨갛고 CI 만 초록이 된다.
      # 그 드리프트가 이 워크플로가 존재하는 이유다.
      - if: needs.detect.outputs.jvm == 'true'
        name: require an executable wrapper at every build root
        run: |
          # 어댑터(adapters/jvm.sh)의 판정과 **같은 기준**으로 본다.
          # 존재만 확인하면 두 판정이 어긋난다 — 실행권한 없는 gradlew 는 어댑터가
          # `[ -x ./gradlew ]` 에서 거짓으로 보고 시스템 gradle 로 내려가는데,
          # 러너 이미지에는 gradle 이 있어서 초록으로 끝난다. 훅에 대해 vendored 잡이
          # 이미 하는 것과 같은 검사를 래퍼에도 한다.
          #
          # 빌드 루트마다 본다. 레포 어딘가에 래퍼가 하나만 있으면 통과시키면,
          # 래퍼 없는 다른 빌드 루트가 시스템 gradle 로 조용히 검사된다.
          . .ai-kit/gate/lib.sh
          fail=0
          while IFS= read -r m; do
            d=$(dirname "$m")
            w="$d/gradlew"
            if [ ! -f "$w" ]; then
              echo "::error::$d 에 빌드 래퍼($(basename "$w"))가 없습니다."
              fail=1
            elif [ ! -x "$w" ]; then
              echo "::error::$w 에 실행권한이 없습니다 — 어댑터가 시스템 빌드 도구로 내려갑니다."
              echo "  git update-index --chmod=+x $w 로 고치고 커밋하세요."
              fail=1
            fi
          # 빌드 루트는 **조상 하나**다 — gate.sh 의 판정과 같아야 한다.
          # 마커가 있는 모든 디렉터리를 빌드 루트로 보면 표준 멀티모듈 레포(루트에만
          # gradlew, 서브모듈마다 build.gradle)가 여기서 실패한다. 어댑터는 그 서브모듈에
          # 들어가지도 않는데 CI 만 실패한다.
          # 건너뛰는 디렉터리도 게이트와 같다. build/ 를 이름으로 거르지 않는다 —
          # 업무 도메인 이름이기도 해서 멀쩡한 모듈이 빠진다(lib.sh 의 GATE_PRUNE_DIRS 주석).
          done < <(find . \( $(gate_prune_expr) \) -prune -o \
                          \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \
                             -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print \
                   | while IFS= read -r m; do printf '%s|%s\n' "$(dirname "$m")" "$m"; done \
                   | sort -u -t'|' -k1,1 \
                   | awk -F'|' '{
                       keep = 1
                       for (i = 1; i <= n; i++) if (index($1 "/", roots[i] "/") == 1 && $1 != roots[i]) keep = 0
                       if (keep) { roots[++n] = $1; print $2 }
                     }' )
          if [ "$fail" = 1 ]; then
            echo "래퍼가 없으면 빌드 도구 버전이 러너 이미지에 묶여 고정되지 않고,"
            echo "래퍼를 쓰지 않는 개발자 머신과 CI 가 서로 다른 버전으로 검사합니다."
            echo "  gradle wrapper 후 커밋하세요."
            exit 1
          fi
          echo "모든 빌드 루트에 실행 가능한 래퍼가 있습니다."

      # gradle 캐시 키는 빌드 루트가 어디에 있든 그 빌드 루트의 의존성 파일로 만든다. setup-java 는
      # cache-dependency-path 를 주면 기본 패턴 대신 그것만 보고(setup-java v6 의 src/cache.ts), 기본 패턴 가운데
      # buildSrc 둘과 gradle/*.versions.toml 은 레포 루트에 묶여 있다. 그래서 빌드 루트가 backend/ 같은 하위
      # 디렉터리면 버전 카탈로그가 키에 들지 않았고, 카탈로그에서만 버전을 올리면 키가 그대로라 전의 캐시를
      # 복원하고 저장하지 않았다(이슈 #116). 기본 패턴을 그대로 적되 그 셋에 **/ 를 붙인다.
      - if: needs.detect.outputs.jvm == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.AI_KIT_JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.properties
            **/gradle-wrapper.properties
            **/buildSrc/**/Versions.kt
            **/buildSrc/**/Dependencies.kt
            **/gradle/*.versions.toml
            **/versions.properties
      - if: needs.detect.outputs.jvm == 'true'
        name: install ktlint
        # 린트는 빌드 도구를 거치지 않고 직접 실행된다 — golangci-lint 와 같은 모양이다.
        # 버전을 핀한다. @latest 는 코드 변경 없이 규칙이 바뀌어 게이트가 빨개진다.
        run: |
          curl -fsSL -o /tmp/ktlint \
            https://github.com/ktlint/ktlint/releases/download/${{ steps.tv.outputs.ktlint }}/ktlint
          chmod +x /tmp/ktlint && sudo mv /tmp/ktlint /usr/local/bin/ktlint
          ktlint --version

      # Python: ruff 를 핀해 설치한다. 다만 이것은 **프로젝트가 ruff 를 선언하지 않았을
      # 때의 바닥값**이다 — 선언했다면 어댑터가 그 venv 의 것을 먼저 쓴다(adapters/py.sh).
      # 린트 규칙은 프로젝트 설정이 정하므로 버전도 프로젝트가 정하는 것이 맞고,
      # 킷의 핀은 아무것도 선언하지 않은 레포가 검사 없이 지나가지 않게 하는 장치다.
      # mypy·pytest 는 프로젝트가 자기 의존성으로 설치해야 한다(아래 주석 참조).
      # 런타임 버전은 **프로젝트의 `.python-version`** 이 정한다 — node 가 `.nvmrc` 를
      # 쓰는 것과 같은 모양이고, `uv python pin 3.12` 가 그 파일을 만든다.
      # 킷이 버전을 고르지 않는다. 고르면 프로젝트가 정한 값과 두 벌이 된다.
      #
      # `pyproject.toml` 의 `requires-python` 은 쓰지 않는다. 범위(`>=3.12`)라 핀이
      # 아니어서 CI 가 어느 날 다른 인터프리터로 실행된다. 위치도 문제다 — 게이트는 마커를
      # 어느 깊이에서든 찾으므로 `py/pyproject.toml` 같은 배치에서 "지정한 파일이 없다"
      # 로 잡이 실패한다(실제로 러너에서 그랬다). `.python-version` 은 잡 하나에
      # 인터프리터 하나이므로 레포 루트에 둔다.
      - if: needs.detect.outputs.py == 'true'
        name: check .python-version
        # 없으면 setup-python 이 알아보기 어려운 오류를 내며 실패한다. 여기서 먼저 말한다.
        run: |
          [ -f .python-version ] && exit 0
          echo "::error::.python-version 이 없습니다 — 레포 루트에서 'uv python pin 3.12' 로 만들고 커밋하세요(또는 그 파일에 버전 한 줄)"
          exit 1
      - if: needs.detect.outputs.py == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - if: needs.detect.outputs.py == 'true'
        name: install ruff
        run: pipx install ruff==${{ steps.tv.outputs.ruff }} && ruff --version
      # 프로젝트의 개발 의존성(pytest·mypy 등)을 설치한다.
      #
      # 킷이 도구 이름을 정하지 않는다 — **프로젝트가 남긴 증거**로 방식을 고른다.
      # 증거가 없으면 설치하지 않고 그 사실을 말한다. 추측해서 설치하면 프로젝트가
      # 의도한 것과 다른 환경에서 테스트가 실행되고, 그 차이는 조용히 숨는다.
      - if: needs.detect.outputs.py == 'true'
        name: install project dev dependencies
        run: |
          set -e
          . .ai-kit/gate/lib.sh
          # **모든** pyproject 를 순회한다. 게이트는 마커가 있는 모든 디렉터리에서 py
          # 어댑터를 실행하므로(조상-자손 제거는 빌드 도구가 있는 언어에만 적용된다), 첫 하나만 설치하면
          # 나머지는 도구 없이 검사되거나 남의 의존성으로 테스트가 실행된다.
          # 바로 아래 node 단계도 같은 이유로 전부 순회한다.
          while IFS= read -r f; do
            d=$(dirname "$f")          # xargs 를 쓰지 않는다 — 공백 있는 경로에서 깨진다
            echo "── $d ──"
            ( cd "$d"
              # $GITHUB_PATH 에 venv 를 얹지 않는다. 그것은 잡 전체에 prepend 되므로
              # 패키지가 여럿이면 **어느 하나의 venv 가 전부를 이긴다** — 남의 의존성으로
              # 테스트가 실행되고, 어느 패키지의 도구가 이길지도 순서에 좌우된다.
              # 대신 어댑터가 자기 디렉터리의 .venv/bin 을 먼저 본다(adapters/py.sh).
              if [ -f uv.lock ]; then
                pipx install uv >/dev/null 2>&1 || true
                # --locked: 락과 pyproject 가 어긋나면 조용히 갱신하지 말고 실패한다.
                # 커밋된 락과 다른 해상도로 CI 가 통과하면 그 차이는 아무도 못 본다.
                uv sync --locked --all-extras --all-groups   # extras 로 dev 를 선언한 레포도 덮는다
              elif [ -f poetry.lock ]; then
                pipx install poetry >/dev/null 2>&1 || true
                # in-project venv 로 강제해 어댑터가 .venv/bin 에서 찾게 한다.
                poetry config virtualenvs.in-project true --local
                # 그룹 이름을 추측하지 않는다 — `--with dev` 는 dev 그룹이 없으면
                # exit 1 이라 set -e 아래에서 잡이 실패한다. 있을 때만 붙인다.
                # --no-root 도 쓰지 않는다: 형제 분기(pip -e . · uv sync)는 루트를
                # 설치하므로, 여기만 빼면 테스트가 자기 패키지를 import 하지 못한다.
                if poetry check --quiet 2>/dev/null && \
                   python -c "import sys,tomllib,pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); sys.exit(0 if 'dev' in (((d.get('tool') or {}).get('poetry') or {}).get('group') or {}) else 1)"; then
                  poetry install --with dev
                else
                  poetry install
                fi
              elif python - <<'PYCHK'
          import sys,tomllib,pathlib
          d=tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          sys.exit(0 if "dev" in (d.get("dependency-groups") or {}) else 1)
          PYCHK
              then
                python -m pip install --group dev -e .
              elif python - <<'PYCHK'
          import sys,tomllib,pathlib
          d=tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          sys.exit(0 if "dev" in ((d.get("project") or {}).get("optional-dependencies") or {}) else 1)
          PYCHK
              then
                python -m pip install -e '.[dev]'
              elif [ -f requirements-dev.txt ]; then
                python -m pip install -r requirements-dev.txt
              else
                echo "::notice::$d 에 dev 의존성 선언이 없습니다 — pytest·mypy 를 쓴다면" \
                     "uv.lock · poetry.lock · [dependency-groups].dev ·" \
                     "[project.optional-dependencies].dev · requirements-dev.txt 중 하나로 선언하세요."
              fi
            )
          done < <(find . \( $(gate_prune_expr) \) -prune -o -name pyproject.toml -print)

      # node 버전은 **레포 루트의 `.nvmrc`** 가 정한다. 없으면 여기서 이유를 말하며 멈춘다
      # (lib.sh 의 gate_nvmrc_check). 한때 setup-node 가 루트의 `.nvmrc` 와 lockfile 을 가정했고,
      # 그 실패를 continue-on-error 가 초록으로 덮었다(실제로 확인함). lockfile 은 모듈마다 있을 수 있어
      # cache 키를 레포 어디의 lockfile 로든 만든다. 이 값을 주면 setup-node 는 기본 패턴 대신
      # 이것만 보고, 하나도 안 맞으면 멈추므로 npm ci 가 읽는 둘을 다 적는다.
      - if: needs.detect.outputs.node == 'true'
        name: require a root .nvmrc
        run: |
          . .ai-kit/gate/lib.sh
          gate_nvmrc_check
      - if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
      - if: needs.detect.outputs.node == 'true'
        run: |
          # 줄 단위로 읽는다. `for d in $(…)` 는 공백 든 경로에서 낱말이 나뉘어 cd 가 실패했다.
          . .ai-kit/gate/lib.sh
          while IFS= read -r f; do
            echo "── $(dirname "$f") ──"
            (cd "$(dirname "$f")" && npm ci --no-audit --no-fund)
          done < <(find . \( $(gate_prune_expr) \) -prune -o -name package.json -print)

      # 게이트 본체 — 로컬 pre-push 와 같은 스크립트.
      - run: bash .ai-kit/gate/gate.sh --all

  coverage:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠️ 프로젝트에 env 게이트된 통합 테스트(DB 등)가 있다면 gate 잡과 같은
    #    services 를 여기에도 붙여야 한다. 없으면 그 테스트가 skip 되어
    #    커버리지가 과소 보고된다 — 틀린 숫자는 없느니만 못하다.
    steps:
      - uses: actions/checkout@v7
      - name: require the kit's minimum Go
        run: |
          . .ai-kit/gate/lib.sh
          gate_go_min_check
      # 캐시 키는 gate 잡과 같다(레포 전체의 go.mod 와 go.sum). 세 잡 가운데 먼저 끝난 잡의 캐시가 저장된다.
      - uses: actions/setup-go@v7
        with:
          go-version-file: '${{ needs.detect.outputs.gomod }}'
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      # 먼저 측정하고 보이게 한다. 임계값은 COVER_MIN 을 설정할 때만 강제한다 —
      # 첫날부터 실패하는 임계값은 결국 꺼진다.
      #
      # 모듈마다 실행한다. go.mod 가 루트에 없을 수 있고 여럿일 수 있다.
      # go test 가 실패하면 이 잡도 실패한다. 한때 `go test | tee` 에 pipefail 이 없어 테스트가
      # 실패해도 「보고만 합니다」로 초록이었다(실제로 확인함). 틀린 숫자를 초록으로 내지 않는다.
      # pipefail 을 스텝 전체에 설정하지 않고 go test 의 종료 코드만 본다. 설정하면 아래 COVER_MIN 판정의
      # grep 이 커버리지 숫자를 못 찾을 때 그 대입이 스텝을 말없이 끝낸다.
      - name: 패키지별 커버리지
        env:
          COVER_MIN: ${{ vars.COVER_MIN }}
        run: |
          . .ai-kit/gate/lib.sh
          : > /tmp/cov.txt
          fail=0
          while IFS= read -r mod; do
            d=$(dirname "$mod")
            echo "── $d ──" | tee -a /tmp/cov.txt
            ( cd "$d" && go test -cover ./... ) 2>&1 | tee -a /tmp/cov.txt
            [ "${PIPESTATUS[0]}" = 0 ] || fail=1
          done < <(find . \( $(gate_prune_expr) \) -prune -o -name go.mod -print)
          {
            echo "### 커버리지"
            echo '```'
            grep -E 'coverage:' /tmp/cov.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" = 0 ] || { echo "::error::go test 가 실패한 모듈이 있습니다 — 위 숫자는 믿을 수 없습니다"; exit 1; }
          [ -z "$COVER_MIN" ] && { echo "COVER_MIN 미설정 — 보고만 합니다."; exit 0; }
          low=$(grep -oE 'coverage: [0-9.]+' /tmp/cov.txt | awk -v m="$COVER_MIN" '{if ($2+0 < m) print}')
          [ -n "$low" ] && { echo "::error::COVER_MIN=$COVER_MIN 미만 패키지가 있습니다"; echo "$low"; exit 1; }
          exit 0

  security:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # 이 잡은 별도 체크아웃이라 gate 잡의 출력을 못 쓴다 — 같은 파일을 다시 읽는다.
      # 숫자를 여기 적어 두면 그 순간부터 단일 출처가 아니게 된다.
      - id: tv
        name: read pinned tool versions
        run: |
          f=.ai-kit/gate/tool-versions
          [ -f "$f" ] || { echo "::error::$f 가 없습니다 — 킷을 갱신하세요"; exit 1; }
          while IFS='=' read -r k v; do
            case "$k" in ''|\#*) continue ;; esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < "$f"

      - name: 시크릿 스캔 (PR 범위)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [ -n "$base" ] && [ -n "$head" ]; then
            bash .ai-kit/gate/secrets.sh --range "${base}..${head}"
          else
            bash .ai-kit/gate/secrets.sh --range "HEAD~1..HEAD"
          fi

      - if: needs.detect.outputs.go == 'true'
        name: require the kit's minimum Go
        run: |
          . .ai-kit/gate/lib.sh
          gate_go_min_check
      # 캐시 키는 gate 잡과 같다(레포 전체의 go.mod 와 go.sum). 세 잡 가운데 먼저 끝난 잡의 캐시가 저장된다.
      - if: needs.detect.outputs.go == 'true'
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: '${{ needs.detect.outputs.gomod }}'
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      # govulncheck 도 gate 잡의 Go 도구처럼 따로 캐시한다(그 잡의 주석). 키는 잡 이름으로 gate 잡과 나눈다.
      - if: needs.detect.outputs.go == 'true'
        id: gotools
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ai-kit/go-tools
          key: ai-kit-go-tools-security-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-govulncheck-${{ steps.tv.outputs.govulncheck }}
      - if: needs.detect.outputs.go == 'true' && steps.gotools.outputs.cache-hit != 'true'
        name: install govulncheck
        run: |
          # govulncheck 도 핀한다 — 취약점 DB 는 항상 최신을 받지만
          # 도구 동작 자체가 조용히 바뀌는 것은 막는다.
          CGO_ENABLED=0 GOBIN="$HOME/.cache/ai-kit/go-tools" go install golang.org/x/vuln/cmd/govulncheck@${{ steps.tv.outputs.govulncheck }}
      - if: needs.detect.outputs.go == 'true' && steps.gotools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ai-kit/go-tools
          key: ${{ steps.gotools.outputs.cache-primary-key }}
      - if: needs.detect.outputs.go == 'true'
        run: echo "$HOME/.cache/ai-kit/go-tools" >> "$GITHUB_PATH"
      - if: needs.detect.outputs.go == 'true'
        name: govulncheck
        # go.mod 가 루트에 없을 수 있다(모노레포). 모듈마다 실행한다.
        run: |
          . .ai-kit/gate/lib.sh
          fail=0
          while IFS= read -r mod; do
            d=$(dirname "$mod")
            echo "── govulncheck $d ──"
            ( cd "$d" && govulncheck ./... ) || fail=1
          done < <(find . \( $(gate_prune_expr) \) -prune -o -name go.mod -print)
          exit $fail

      - if: needs.detect.outputs.node == 'true'
        name: require a root .nvmrc
        run: |
          . .ai-kit/gate/lib.sh
          gate_nvmrc_check
      - if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }
      - if: needs.detect.outputs.node == 'true'
        name: npm audit (high+)
        run: |
          # 줄 단위로 읽는다 — 위 npm ci 단계와 같은 이유다.
          # lockfile 은 둘 다 찾는다. npm 은 npm-shrinkwrap.json 도 lockfile 로 읽고, 한때
          # package-lock.json 만 찾아 shrinkwrap 만 둔 패키지를 조용히 건너뛰었다.
          . .ai-kit/gate/lib.sh
          while IFS= read -r f; do
            echo "── $(dirname "$f") ──"
            (cd "$(dirname "$f")" && npm audit --audit-level=high)
          done < <(find . \( $(gate_prune_expr) \) -prune -o \( -name package-lock.json -o -name npm-shrinkwrap.json \) -print)

  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # SPEC 요구가 추적표에서 조용히 사라지는 것을 막는다.
      - run: bash .ai-kit/gate/trace.sh
