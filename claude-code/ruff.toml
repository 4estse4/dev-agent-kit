# 킷이 `.claude/` 에 놓는 파일(훅의 `.py` · 스킬과 에이전트의 `.md` 속 Python 블록)을 검사하는 ruff 설정이다.
# ruff 는 파일마다 가장 가까운 설정 파일을 쓴다. 그래서 프로젝트가 pyproject 에 `[tool.ruff]` 를 두어 킷의 `ruff.toml`
# 이 프로젝트 루트에 놓이지 않아도 `.claude/` 의 킷 파일은 이 설정으로 검사되고, 프로젝트 파일은 프로젝트 설정으로
# 검사된다. 설정 줄은 킷이 프로젝트 루트에 놓는 `ruff.toml` 과 같고, 프로젝트의 테스트 디렉터리를 가리키는
# `[lint.per-file-ignores]` 표만 뺐다 — `.claude/` 아래에는 그 자리가 없다. `.claude/` 밖에 놓이는 킷 파일은 이 설정을
# 쓰지 않는다.
line-length = 100
target-version = "py312"

[lint]
# E · F 에 더해 실제로 버그를 찾아내는 것들만 켠다. 스타일 취향 규칙은 넣지 않는다 —
# 규칙이 많을수록 끄게 되고, 끄는 린터는 없는 린터다.
select = [
  "E", "F",      # pycodestyle 오류 · pyflakes
  "B",           # flake8-bugbear — 실수하기 쉬운 패턴
  "I",           # isort — import 정렬
  "UP",          # pyupgrade — 낡은 문법
  "SIM",         # flake8-simplify
  "RUF",         # ruff 고유 규칙
]
ignore = [
  "E501",        # 줄 길이는 formatter 가 맡는다. 린터가 또 찾아내면 중복이다.
]
