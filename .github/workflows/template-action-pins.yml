# 킷 템플릿의 액션 핀과 게이트 도구 핀이 뒤처졌는지 주기적으로 본다.
#
# Dependabot 은 .github/workflows/ 와 루트 action.yml 만 훑는다(공식 문서). 킷의
# 워크플로 원본은 common/ci/gates.yml 이라 그 범위 밖이고, 그대로 두면 새 프로젝트가
# 낡은 채로 시작한다. 이 잡이 Dependabot 이 못 가는 자리를 대신 본다.
# 게이트 도구 핀(common/gate/tool-versions)도 Dependabot 이 생태계로 알아보지 못해서
# 같은 잡이 본다(check-tool-pins.sh, 이슈 #110). 최신은 킷이 바뀌지 않아도 바뀌므로 PR 마다
# 보지 않고 주간으로 본다.
#
# 이것은 킷에 게이트를 거는 것이 아니다 — required check 도 브랜치 보호도 아니고,
# 뒤처짐을 알리기만 한다. "킷이 자기 자신에게 게이트를 걸 것인가" 는 여전히 열린 결정이다.
name: template action and tool pins

on:
  schedule:
    - cron: "0 6 * * 1"     # 매주 월요일 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # check-tool-pins.sh 가 Go 도구의 최신을 `go list -m <모듈>@latest` 로 읽는다. 러너 이미지에
      # Go 는 Cached Tools 로만 있어 PATH 에 있다고 볼 수 없다. 킷 레포에는 go.mod 가 없어 캐시를 끈다.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # 두 검사를 먼저 다 실행한다. 한쪽이 판정하지 못해 잡을 끝내면 다른 쪽의 결과를 못 본다.
      - name: Check pinned action versions in the template
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # 자기 자신도 검사 대상에 넣는다. 이 워크플로의 핀은 .github/workflows/ 에
          # 있어 Dependabot 이 볼 수 있지만, 킷에 dependabot 설정을 따로 두는 것보다
          # 이미 있는 검사기에 파일 하나 더 넘기는 쪽이 부품이 적다.
          out=$(bash common/ci/check-action-pins.sh \
                  common/ci/gates.yml \
                  .github/workflows/template-action-pins.yml \
                  .github/workflows/kit-tests.yml 2>&1); rc=$?
          printf '%s\n' "$out"
          {
            echo "rc=$rc"
            echo "out<<EOF_OUT"
            printf '%s\n' "$out"
            echo "EOF_OUT"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check pinned gate tool versions
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(bash common/ci/check-tool-pins.sh 2>&1); rc=$?
          printf '%s\n' "$out"
          {
            echo "rc=$rc"
            echo "out<<EOF_OUT"
            printf '%s\n' "$out"
            echo "EOF_OUT"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # 뒤처졌으면(rc=1) 이슈를 연다. 조회 실패(rc=2)는 맨 아래 스텝이 잡을 실패로 남긴다 —
      # 판정하지 못한 것을 "이상 없음" 으로 넘기지 않는다.
      - name: Open an issue when action pins are behind
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.check.outputs.out }}
        run: |
          title="template action pins are behind"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$title" --body "$BODY"
          fi

      - name: Open an issue when gate tool pins are behind
        if: steps.tools.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.tools.outputs.out }}
        run: |
          title="gate tool pins are behind"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$title" --body "$BODY"
          fi

      - name: Fail when a check could not decide
        if: steps.check.outputs.rc == '2' || steps.tools.outputs.rc == '2'
        run: |
          [ "${{ steps.check.outputs.rc }}" = 2 ] && echo "::error::액션 태그를 조회하지 못해 판정할 수 없습니다"
          [ "${{ steps.tools.outputs.rc }}" = 2 ] && echo "::error::도구의 최신 버전을 조회하지 못해 판정할 수 없습니다"
          exit 1
