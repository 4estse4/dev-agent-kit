# 킷 자신의 검사. PR 마다 실행된다.
#
# 왜 CI 인가: 이 검사들은 원래 세션 안에서만 실행되던 것이었고, 그동안 킷의 하드룰은
# "설치기를 고치면 깨끗한 데모 레포에 설치해 재현한다" 의 「누가 막나」를 `막는 것 없음` 으로 두고 있었다.
# 사람에게 맡긴 그 자리로, 안 지운 pre-commit·pre-push 를 지웠다고 보고하는 회귀가
# 한 라운드를 통과했다. 기억이 아니라 검사가 막아야 한다.
#
# `tests` 잡은 required check 다 — `main` 룰셋이 이 잡이 실패한 PR 의 머지를 막는다(ADR-0002
# 「결과」). 게이트와 훅을 킷 자신에게 적용할지는 여전히 "킷이 자기 자신에게 게이트를 적용할 것인가"
# 라는 열린 결정이다(이슈 #4).
name: kit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # install.sh 는 대상 레포에 git 신원이 있어야 identity 파일을 만든다.
      - name: Configure a git identity for the temporary repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Shell syntax
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || fail=1; done
          echo "shell $(git ls-files '*.sh' | wc -l | tr -d ' ')개 · 구문실패 $fail"
          exit $fail

      - name: settings.json parses
        run: python3 -c "import json; json.load(open('claude-code/settings.json'))"

      # **한 검사가 실패해도 나머지 검사를 다 실행한다.** 기본값(첫 실패에서 멈춤)이면 그 커밋에서
      # 다른 검사가 무엇을 말했을지 영영 모르고, 고치고 다시 푸시해야 다음 것이 보인다.
      # 라운드가 열여섯 번 진행된 PR 이 있었고, 그런 PR 에서 그 왕복은 비용이 크다.
      - name: install.sh says what it actually deletes
        id: deletions
        continue-on-error: true
        run: bash tests/install-deletions.sh

      - name: every injected string is explained and gh injections exit 0 when gh fails
        id: injections
        continue-on-error: true
        run: bash tests/skill-injections.sh

      - name: installed docs do not lie
        id: docs
        continue-on-error: true
        run: bash tests/installed-docs.sh

      - name: git path lists are read with quotePath off
        id: quotepath
        continue-on-error: true
        run: bash tests/gate-quotepath.sh

      # 이 둘은 게이트와 훅을 실제로 실행한다.
      - name: the gate picks the changed module as a target
        id: targets
        continue-on-error: true
        run: bash tests/gate-targets.sh

      - name: pre-commit blocks conflict markers in a large file
        id: markers
        continue-on-error: true
        run: bash tests/pre-commit-markers.sh

      - name: module markers are found the way the gate finds them
        id: discovery
        continue-on-error: true
        run: bash tests/gate-discovery.sh

      - name: every job that sets up Go checks the kit's minimum Go first
        id: gomin
        continue-on-error: true
        run: bash tests/gate-go-min.sh

      - name: Go is set up from the go.mod that is there, its tools are cached per job, and coverage runs per module
        id: goci
        continue-on-error: true
        run: bash tests/gate-go-ci.sh

      - name: node is set up from a root .nvmrc and its failures are not masked
        id: nodeci
        continue-on-error: true
        run: bash tests/gate-node-ci.sh

      - name: JVM is Kotlin and Gradle only, and the gradle cache key covers a build root in a subdirectory
        id: jvmci
        continue-on-error: true
        run: bash tests/gate-jvm-ci.sh

      - name: the secret scan in CI covers every commit a push brings in
        id: secretsci
        continue-on-error: true
        run: bash tests/gate-secrets-ci.sh

      - name: a missing adapter says to reinstall with the language added to the installed --lang list
        id: missingadapter
        continue-on-error: true
        run: bash tests/gate-missing-adapter.sh

      - name: inside a Claude Code session the git hook and the gate refuse the escape variables
        id: sessionescapes
        continue-on-error: true
        run: bash tests/session-escapes.sh

      # go_min 이 핀한 Go 도구가 요구하는 go 와 그 도구가 쓰는 gofumpt 의 기준 Go 가운데 가장 높은 것과
      # 같은지. 진짜 모듈 proxy 에 묻는다 — 핀을 올리는 그 PR 에서 찾아내게 PR 마다 실행된다. 아래 스텝이
      # 같은 검사를 가짜 proxy 로 네트워크 없이 시험한다.
      - name: go_min matches the Go the pinned tools and gofumpt need
        id: gominpins
        continue-on-error: true
        run: bash common/ci/check-go-min.sh

      - name: the go_min check catches a mismatch
        id: checkgomin
        continue-on-error: true
        run: bash tests/check-go-min.sh

      # 도구 핀이 최신보다 뒤처졌는지는 주간 워크플로가 진짜 출처에 묻는다. 여기서는 가짜 출처로
      # 네트워크 없이 그 판정을 시험한다.
      - name: the tool pin check tells behind from undecided
        id: toolpins
        continue-on-error: true
        run: bash tests/check-tool-pins.sh

      # 에이전트 훅을 Claude Code 가 부르는 모양(표준입력 JSON)으로 실행한다. gh 는 가짜로 바꿔
      # 저장해 둔 코멘트를 읽힌다 — 네트워크도 토큰도 안 쓴다.
      - name: the round comment hook blocks quotes missing from the answers
        id: roundquotes
        continue-on-error: true
        run: bash tests/round-comment-quotes.sh

      # 편집 직후 포맷 훅도 같은 모양으로 실행한다. ruff 는 부른 자리와 인자를 적는 가짜다.
      - name: the edit hook runs the gate's ruff where the gate runs it
        id: postedit
        continue-on-error: true
        run: bash tests/post-edit-ruff.sh

      # 킷을 설치한 Python 레포에서 게이트를 진짜 ruff 로 실행한다. ruff 는 tool-versions 의 핀으로 설치하고, 테스트는
      # PATH 의 ruff 가 핀과 다르면 실패한다 — 설치가 실패해도 그 테스트가 실패로 알린다.
      - name: Install the pinned ruff
        continue-on-error: true
        run: pipx install "ruff==$(sed -n 's/^ruff=//p' common/gate/tool-versions)" && ruff --version

      - name: files the kit installs pass the gate's ruff in a Python project
        id: installedruff
        continue-on-error: true
        run: bash tests/installed-ruff.sh

      # 킷을 설치한 TypeScript 레포에서 게이트를 진짜 prettier 로 실행한다. 킷은 TypeScript 도구를 핀하지 않으므로(프로젝트의
      # 락파일이 정한다) 버전은 테스트 파일의 PIN 이다. 테스트는 PATH 의 prettier 가 그 버전과 다르면 실패한다 — 설치가
      # 실패해도 그 테스트가 실패로 알린다.
      - name: Install the prettier the test pins
        continue-on-error: true
        run: npm install -g "prettier@$(sed -n 's/^PIN=//p' tests/installed-prettier.sh)" && prettier --version

      - name: files the kit installs pass the gate's prettier in a TypeScript project
        id: installedprettier
        continue-on-error: true
        run: bash tests/installed-prettier.sh

      - name: PR evidence is appended by a command, not copied by hand
        id: evidence
        continue-on-error: true
        run: bash tests/pr-evidence.sh

      - name: verification-stages sections are referenced by number
        id: sections
        continue-on-error: true
        run: bash tests/section-refs.sh

      - name: kit files do not use translated verbs or the words the kit replaced
        id: terms
        continue-on-error: true
        run: bash tests/term-rules.sh

      - name: the --lang filter keeps the comments of the steps it keeps
        id: filterlangs
        continue-on-error: true
        run: bash tests/filter-langs.sh

      - name: merge-pr deletes the branches and returns to base in a git worktree too
        id: mergecleanup
        continue-on-error: true
        run: bash tests/merge-pr-cleanup.sh

      - name: the installed dependabot.yml enables only github-actions
        id: dependabot
        continue-on-error: true
        run: bash tests/dependabot.sh

      - name: GitHub templates in open-pr and merge-pr keep each paragraph on one line
        id: ghlines
        continue-on-error: true
        run: bash tests/github-template-lines.sh

      - name: revive in the Go lint config runs its default rules
        id: revive
        continue-on-error: true
        run: bash tests/golangci-revive.sh

      - name: merge-pr passes the PR title and number as the squash subject
        id: subject
        continue-on-error: true
        run: bash tests/merge-pr-subject.sh

      - name: open-pr reads the round comment head from its head line
        id: roundhead
        continue-on-error: true
        run: bash tests/round-comment-head.sh

      - name: merge-pr reads every answer comment for issues to close
        id: answers
        continue-on-error: true
        run: bash tests/merge-pr-answers.sh

      # 가짜 gh 가 코멘트 · 리뷰 · 레포 권한을, 가짜 curl 이 App 설치 · 토큰을 돌려준다. 개인키는
      # 테스트가 만든 버릴 키다 — 네트워크도 진짜 키도 안 쓴다.
      - name: with a bot config human decisions are human-account comments and a human approve
        id: humanreview
        continue-on-error: true
        run: bash tests/human-review.sh

      - name: branch protection requires a human approve only with a bot config
        id: protect
        continue-on-error: true
        run: bash tests/protect-branch.sh

      - name: reviews and merge-pr pick human decisions after the round comment
        id: answerwindow
        continue-on-error: true
        run: bash tests/answer-window.sh

      - name: with a bot config the session gh is wired to the bot and writes around it are blocked
        id: botwiring
        continue-on-error: true
        run: bash tests/bot-wiring.sh

      - name: the window hook records only the options a person picked for a person-account comment
        id: windowrecord
        continue-on-error: true
        run: bash tests/window-record.sh

      - name: the session-start hook says when the installed kit is behind the kit clone
        id: freshness
        continue-on-error: true
        run: bash tests/kit-freshness.sh

      - name: the installed settings and this repo's settings deny pkill and killall
        id: killdeny
        continue-on-error: true
        run: bash tests/process-kill-deny.sh

      - name: the installer places the eslint config only beside a package.json that uses eslint
        id: eslintconfig
        continue-on-error: true
        run: bash tests/install-eslint-config.sh

      - name: settings write file path rules only as Read and Edit
        id: pathrules
        continue-on-error: true
        run: bash tests/settings-path-rules.sh

      - name: hooks record the cold review report and the round comment carries it unchanged
        id: reviewrecord
        continue-on-error: true
        run: bash tests/review-record.sh

      - name: each skill keeps SKILL.md short and links every supporting file
        id: skilllayout
        continue-on-error: true
        run: bash tests/skill-layout.sh

      - name: the next-task list carries every open issue and the work other sessions hold
        id: backlog
        continue-on-error: true
        run: bash tests/backlog.sh

      - name: fail if any check failed
        run: |
          bad=0
          for r in "${{ steps.deletions.outcome }}" "${{ steps.injections.outcome }}" "${{ steps.docs.outcome }}" "${{ steps.quotepath.outcome }}" "${{ steps.targets.outcome }}" "${{ steps.markers.outcome }}" "${{ steps.discovery.outcome }}" "${{ steps.gomin.outcome }}" "${{ steps.goci.outcome }}" "${{ steps.nodeci.outcome }}" "${{ steps.jvmci.outcome }}" "${{ steps.secretsci.outcome }}" "${{ steps.missingadapter.outcome }}" "${{ steps.gominpins.outcome }}" "${{ steps.checkgomin.outcome }}" "${{ steps.toolpins.outcome }}" "${{ steps.roundquotes.outcome }}" "${{ steps.postedit.outcome }}" "${{ steps.installedruff.outcome }}" "${{ steps.installedprettier.outcome }}" "${{ steps.evidence.outcome }}" "${{ steps.sections.outcome }}" "${{ steps.terms.outcome }}" "${{ steps.filterlangs.outcome }}" "${{ steps.mergecleanup.outcome }}" "${{ steps.dependabot.outcome }}" "${{ steps.ghlines.outcome }}" "${{ steps.revive.outcome }}" "${{ steps.subject.outcome }}" "${{ steps.roundhead.outcome }}" "${{ steps.answers.outcome }}" "${{ steps.humanreview.outcome }}" "${{ steps.protect.outcome }}" "${{ steps.answerwindow.outcome }}" "${{ steps.botwiring.outcome }}" "${{ steps.windowrecord.outcome }}" "${{ steps.freshness.outcome }}" "${{ steps.killdeny.outcome }}" "${{ steps.eslintconfig.outcome }}" "${{ steps.pathrules.outcome }}" "${{ steps.reviewrecord.outcome }}" "${{ steps.skilllayout.outcome }}" "${{ steps.backlog.outcome }}" "${{ steps.sessionescapes.outcome }}"; do
            [ "$r" = failure ] && bad=1
          done
          echo "deletions=${{ steps.deletions.outcome }} · injections=${{ steps.injections.outcome }} · docs=${{ steps.docs.outcome }} · quotepath=${{ steps.quotepath.outcome }} · targets=${{ steps.targets.outcome }} · markers=${{ steps.markers.outcome }} · discovery=${{ steps.discovery.outcome }} · gomin=${{ steps.gomin.outcome }} · goci=${{ steps.goci.outcome }} · nodeci=${{ steps.nodeci.outcome }} · jvmci=${{ steps.jvmci.outcome }} · secretsci=${{ steps.secretsci.outcome }} · missingadapter=${{ steps.missingadapter.outcome }} · gominpins=${{ steps.gominpins.outcome }} · checkgomin=${{ steps.checkgomin.outcome }} · toolpins=${{ steps.toolpins.outcome }} · roundquotes=${{ steps.roundquotes.outcome }} · postedit=${{ steps.postedit.outcome }} · installedruff=${{ steps.installedruff.outcome }} · installedprettier=${{ steps.installedprettier.outcome }} · evidence=${{ steps.evidence.outcome }} · sections=${{ steps.sections.outcome }} · terms=${{ steps.terms.outcome }} · filterlangs=${{ steps.filterlangs.outcome }} · mergecleanup=${{ steps.mergecleanup.outcome }} · dependabot=${{ steps.dependabot.outcome }} · ghlines=${{ steps.ghlines.outcome }} · revive=${{ steps.revive.outcome }} · subject=${{ steps.subject.outcome }} · roundhead=${{ steps.roundhead.outcome }} · answers=${{ steps.answers.outcome }} · humanreview=${{ steps.humanreview.outcome }} · protect=${{ steps.protect.outcome }} · answerwindow=${{ steps.answerwindow.outcome }} · botwiring=${{ steps.botwiring.outcome }} · windowrecord=${{ steps.windowrecord.outcome }} · freshness=${{ steps.freshness.outcome }} · killdeny=${{ steps.killdeny.outcome }} · eslintconfig=${{ steps.eslintconfig.outcome }} · pathrules=${{ steps.pathrules.outcome }} · reviewrecord=${{ steps.reviewrecord.outcome }} · skilllayout=${{ steps.skilllayout.outcome }} · backlog=${{ steps.backlog.outcome }} · sessionescapes=${{ steps.sessionescapes.outcome }}"
          exit $bad
