# 킷 자신의 검사. PR 마다 돈다.
#
# 왜 CI 인가: 이 검사 둘은 원래 세션 안에서만 돌던 것이었고, 그동안 킷의 하드룰은
# "설치기를 고치면 깨끗한 데모 레포에 설치해 재현한다" 를 `사람` 에게 맡기고 있었다.
# 그 자리가 실제로 뚫려서, 안 지운 pre-commit·pre-push 를 지웠다고 보고하는 회귀가
# 한 라운드를 통과했다. 기억이 아니라 검사가 막아야 한다.
#
# 이것은 required check 가 아니다 — 브랜치 보호는 아직 없다. 빨간 것을 보고도 머지할 수
# 있고, 그 사실이 "킷이 자기 자신에게 게이트를 걸 것인가" 라는 열린 결정에 달려 있다.
name: kit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # install.sh 는 대상 레포에 git 신원이 있어야 identity 를 시드한다.
      - name: Configure a git identity for the temporary repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Shell syntax
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || fail=1; done
          echo "shell $(git ls-files '*.sh' | wc -l | tr -d ' ')개 · 구문실패 $fail"
          exit $fail

      - name: settings.json parses
        run: python3 -c "import json; json.load(open('claude-code/settings.json'))"

      - name: install.sh says what it actually deletes
        run: bash tests/install-deletions.sh

      - name: every injected string is explained
        run: bash tests/skill-injections.sh
