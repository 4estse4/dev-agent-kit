# 킷 자신의 검사. PR 마다 돈다.
#
# 왜 CI 인가: 이 검사들은 원래 세션 안에서만 돌던 것이었고, 그동안 킷의 하드룰은
# "설치기를 고치면 깨끗한 데모 레포에 설치해 재현한다" 를 `사람` 에게 맡기고 있었다.
# 그 자리가 실제로 뚫려서, 안 지운 pre-commit·pre-push 를 지웠다고 보고하는 회귀가
# 한 라운드를 통과했다. 기억이 아니라 검사가 막아야 한다.
#
# 이것은 required check 가 아니다 — 브랜치 보호는 아직 없다. 빨간 것을 보고도 머지할 수
# 있고, 그 사실이 "킷이 자기 자신에게 게이트를 걸 것인가" 라는 열린 결정에 달려 있다.
name: kit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # install.sh 는 대상 레포에 git 신원이 있어야 identity 를 시드한다.
      - name: Configure a git identity for the temporary repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Shell syntax
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || fail=1; done
          echo "shell $(git ls-files '*.sh' | wc -l | tr -d ' ')개 · 구문실패 $fail"
          exit $fail

      - name: settings.json parses
        run: python3 -c "import json; json.load(open('claude-code/settings.json'))"

      # **한 검사가 빨개도 나머지를 다 돌린다.** 기본값(첫 실패에서 멈춤)이면 그 커밋에서
      # 다른 검사가 무엇을 말했을지 영영 모르고, 고치고 다시 밀어야 다음 것이 보인다.
      # 라운드가 열여섯 번 돈 이 PR 에서 그 왕복은 비용이 크다.
      - name: install.sh says what it actually deletes
        id: deletions
        continue-on-error: true
        run: bash tests/install-deletions.sh

      - name: every injected string is explained
        id: injections
        continue-on-error: true
        run: bash tests/skill-injections.sh

      - name: installed docs do not lie
        id: docs
        continue-on-error: true
        run: bash tests/installed-docs.sh

      - name: git path lists are read with quotePath off
        id: quotepath
        continue-on-error: true
        run: bash tests/gate-quotepath.sh

      # 이 둘은 게이트와 훅을 실제로 돌린다.
      - name: the gate picks the changed module as a target
        id: targets
        continue-on-error: true
        run: bash tests/gate-targets.sh

      - name: pre-commit blocks conflict markers in a large file
        id: markers
        continue-on-error: true
        run: bash tests/pre-commit-markers.sh

      - name: module markers are found the way the gate finds them
        id: discovery
        continue-on-error: true
        run: bash tests/gate-discovery.sh

      - name: every job that sets up Go checks the kit's minimum Go first
        id: gomin
        continue-on-error: true
        run: bash tests/gate-go-min.sh

      - name: Go is set up from the go.mod that is there and coverage runs per module
        id: goci
        continue-on-error: true
        run: bash tests/gate-go-ci.sh

      - name: node is set up from a root .nvmrc and its failures are not masked
        id: nodeci
        continue-on-error: true
        run: bash tests/gate-node-ci.sh

      # go_min 이 핀한 Go 도구가 요구하는 go 와 같은지. 진짜 모듈 proxy 에 묻는다 — 핀을 올리는 그
      # PR 에서 잡히게 PR 마다 돈다. 아래 스텝이 같은 검사를 가짜 proxy 로 네트워크 없이 시험한다.
      - name: go_min matches the Go the pinned tools need
        id: gominpins
        continue-on-error: true
        run: bash common/ci/check-go-min.sh

      - name: the go_min check catches a mismatch
        id: checkgomin
        continue-on-error: true
        run: bash tests/check-go-min.sh

      # 에이전트 훅을 Claude Code 가 부르는 모양(표준입력 JSON)으로 돌린다. gh 는 가짜로 바꿔
      # 떠 둔 코멘트를 읽힌다 — 네트워크도 토큰도 안 쓴다.
      - name: the round comment hook blocks quotes missing from the answers
        id: roundquotes
        continue-on-error: true
        run: bash tests/round-comment-quotes.sh

      # 편집 직후 포맷 훅도 같은 모양으로 돌린다. ruff 는 부른 자리와 인자를 적는 가짜다.
      - name: the edit hook runs the gate's ruff where the gate runs it
        id: postedit
        continue-on-error: true
        run: bash tests/post-edit-ruff.sh

      - name: PR evidence is appended by a command, not copied by hand
        id: evidence
        continue-on-error: true
        run: bash tests/pr-evidence.sh

      - name: verification-stages sections are referenced by number
        id: sections
        continue-on-error: true
        run: bash tests/section-refs.sh

      - name: fail if any check failed
        run: |
          bad=0
          for r in "${{ steps.deletions.outcome }}" "${{ steps.injections.outcome }}" "${{ steps.docs.outcome }}" "${{ steps.quotepath.outcome }}" "${{ steps.targets.outcome }}" "${{ steps.markers.outcome }}" "${{ steps.discovery.outcome }}" "${{ steps.gomin.outcome }}" "${{ steps.goci.outcome }}" "${{ steps.nodeci.outcome }}" "${{ steps.gominpins.outcome }}" "${{ steps.checkgomin.outcome }}" "${{ steps.roundquotes.outcome }}" "${{ steps.postedit.outcome }}" "${{ steps.evidence.outcome }}" "${{ steps.sections.outcome }}"; do
            [ "$r" = failure ] && bad=1
          done
          echo "deletions=${{ steps.deletions.outcome }} · injections=${{ steps.injections.outcome }} · docs=${{ steps.docs.outcome }} · quotepath=${{ steps.quotepath.outcome }} · targets=${{ steps.targets.outcome }} · markers=${{ steps.markers.outcome }} · discovery=${{ steps.discovery.outcome }} · gomin=${{ steps.gomin.outcome }} · goci=${{ steps.goci.outcome }} · nodeci=${{ steps.nodeci.outcome }} · gominpins=${{ steps.gominpins.outcome }} · checkgomin=${{ steps.checkgomin.outcome }} · roundquotes=${{ steps.roundquotes.outcome }} · postedit=${{ steps.postedit.outcome }} · evidence=${{ steps.evidence.outcome }} · sections=${{ steps.sections.outcome }}"
          exit $bad
